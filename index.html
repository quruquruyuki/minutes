<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="議事録">
<meta name="theme-color" content="#ffffff">
<title>議事録</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root { --fg:#37352f; --sub:#787774; --line:#e9e9e7; --bg:#fff; --soft:#f7f6f3; --red:#e03e3e; --blue:#2383e2; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif; color:var(--fg); background:var(--bg); font-size:16px; }
  header { position:sticky; top:0; background:rgba(255,255,255,.95); backdrop-filter:blur(8px); border-bottom:1px solid var(--line);
    padding:calc(env(safe-area-inset-top) + 10px) 16px 10px; display:flex; align-items:center; gap:8px; z-index:5; }
  header h1 { font-size:18px; margin:0; flex:1; }
  button { font:inherit; color:inherit; background:none; border:1px solid var(--line); border-radius:8px; padding:8px 12px; }
  button.primary { background:var(--fg); color:#fff; border-color:var(--fg); }
  button:disabled { opacity:.4; }
  .icon { border:none; font-size:20px; padding:6px 8px; }
  main { padding:16px; padding-bottom:calc(env(safe-area-inset-bottom) + 40px); max-width:720px; margin:0 auto; }
  .rec { text-align:center; padding:24px 0 28px; border-bottom:1px solid var(--line); }
  .recbtn { width:96px; height:96px; border-radius:50%; border:4px solid var(--line); background:#fff; display:inline-flex; align-items:center; justify-content:center; padding:0; }
  .recbtn span { width:56px; height:56px; border-radius:50%; background:var(--red); transition:.2s; }
  .recbtn.on span { width:36px; height:36px; border-radius:8px; }
  .timer { font-size:32px; font-variant-numeric:tabular-nums; margin:12px 0 4px; }
  .hint { color:var(--sub); font-size:13px; line-height:1.6; }
  .row { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap; }
  .list { margin-top:8px; }
  .item { padding:14px 4px; border-bottom:1px solid var(--line); display:flex; gap:10px; align-items:center; }
  .item .t { flex:1; min-width:0; }
  .item .t b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .item .t small { color:var(--sub); }
  .tag { font-size:12px; padding:2px 8px; border-radius:4px; background:var(--soft); color:var(--sub); white-space:nowrap; }
  .tag.ok { background:#dbeddb; color:#2b593f; }
  .tag.ng { background:#ffe2dd; color:#5d1715; }
  label { display:block; font-size:13px; color:var(--sub); margin:14px 0 4px; }
  input, select, textarea { width:100%; font:inherit; color:inherit; border:1px solid var(--line); border-radius:8px; padding:10px; background:#fff; }
  textarea { min-height:90px; line-height:1.6; resize:vertical; }
  h2 { font-size:16px; margin:24px 0 6px; }
  .card { background:var(--soft); border-radius:10px; padding:12px; margin-top:10px; }
  .progress { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:8px; }
  .progress div { height:100%; background:var(--blue); width:0; transition:.3s; }
  audio { width:100%; margin-top:6px; }
  .seg { font-size:13px; color:var(--sub); margin-top:8px; }
  .hidden { display:none !important; }
  .meter { margin:4px auto 6px; width:min(260px,70vw); }
  .mbar { position:relative; height:10px; background:var(--soft); border-radius:5px; overflow:hidden; }
  .mbar div { height:100%; width:0; border-radius:5px; background:#9b9a97; transition:width .08s linear; }
  .mbar i { position:absolute; top:0; bottom:0; width:2px; background:rgba(55,53,47,.25); }
  .mtext { font-size:13px; margin-top:6px; font-weight:600; }
  .seg2 { display:inline-flex; background:var(--soft); border-radius:9px; padding:3px; margin-bottom:18px; }
  .seg2 button { border:none; border-radius:7px; padding:7px 18px; color:var(--sub); }
  .seg2 button.on { background:#fff; color:var(--fg); box-shadow:0 1px 2px rgba(0,0,0,.12); font-weight:600; }
  .tag.sem { background:#e7f0fb; color:#1f5aa6; }
  dialog { border:none; border-radius:14px; padding:0; width:min(92vw,520px); max-height:85vh; }
  dialog::backdrop { background:rgba(0,0,0,.3); }
  .dlg { padding:16px 18px 20px; overflow:auto; max-height:85vh; }
  .toast { position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom) + 24px); transform:translateX(-50%); background:var(--fg); color:#fff;
    padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; transition:.3s; pointer-events:none; max-width:90vw; z-index:20; }
  .toast.show { opacity:1; }
  a { color:var(--blue); }
</style>
</head>
<body>

<!-- ログイン -->
<section id="login" class="hidden">
  <header><h1>議事録</h1></header>
  <main>
    <form id="loginForm" style="max-width:420px;margin:24px auto">
      <label>メールアドレス</label><input id="lEmail" type="email" autocomplete="username" required>
      <label>パスワード</label><input id="lPass" type="password" autocomplete="current-password" required>
      <div class="row"><button class="primary" type="submit" id="lBtn">ログイン</button></div>
      <div class="hint" id="lMsg" style="text-align:center;margin-top:10px"></div>
    </form>
  </main>
</section>

<!-- ホーム -->
<section id="home" class="hidden">
  <header><h1>議事録</h1><button class="icon" id="openSettings" aria-label="設定">⚙︎</button></header>
  <main>
    <div class="rec">
      <div class="seg2" id="modeSeg"><button data-m="meeting">会議</button><button data-m="seminar">セミナー</button></div><br>
      <button class="recbtn" id="recBtn" aria-label="録音"><span></span></button>
      <div class="timer" id="timer">00:00</div>
      <div id="recAlert" class="hidden" style="margin:8px auto;max-width:420px;background:#ffe2dd;color:#5d1715;border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.5">
        <div id="recAlertText"></div>
        <button class="primary" id="recResume" style="margin-top:8px">録音を再開する</button>
      </div>
      <div class="meter hidden" id="meter">
        <div class="mbar"><div id="mfill"></div><i style="left:36.7%"></i><i style="left:90%"></i></div>
        <div class="mtext" id="mtext"></div>
      </div>
      <div class="hint" id="recHint">タップで録音開始。録音中は画面を開いたままにしてください。</div>
      <div class="hint" style="margin-top:6px">画面を消して録るときは、iPhoneの「ボイスメモ」で録音して下から読み込んでください（長さの制限なし）</div>
      <div class="row">
        <label style="margin:0"><button id="importBtn">音声ファイルを読み込む</button></label>
        <input type="file" id="importFile" accept="audio/*" multiple class="hidden">
      </div>
    </div>
    <div class="hint" id="monthCost" style="text-align:right;margin-top:12px"></div>
    <div class="list" id="list"></div>
  </main>
</section>

<!-- 詳細 -->
<section id="detail" class="hidden">
  <header><button class="icon" id="back" aria-label="戻る">‹</button><h1 id="dTitle">議事録</h1><button class="icon" id="delBtn" aria-label="削除">🗑</button></header>
  <main>
    <div class="card">
      <div id="dMeta" class="hint"></div>
      <label>種類</label>
      <select id="dMode"><option value="meeting">会議（議事録）</option><option value="seminar">セミナー（セミナーノート）</option></select>
      <label>まとめの精度</label>
      <select id="dQuality"><option value="standard">標準</option><option value="hq">高精度（料金は約2倍）</option></select>
      <label id="dMemoLabel">補足メモ</label>
      <input id="dMemo">
      <div class="row">
        <button class="primary" id="runBtn">文字起こしして議事録を作る</button>
      </div>
      <div class="progress hidden" id="prog"><div></div></div>
      <div class="hint" id="progText" style="margin-top:6px"></div>
    </div>

    <div id="resultArea" class="hidden">
      <label>タイトル</label><input id="rTitle">
      <label>日付</label><input id="rDate" type="date">
      <div id="meetFields">
      <label>ジャンル</label><input id="rGenre">
      <label>要約</label><textarea id="rSummary"></textarea>
      <label>参加者（読点区切り）</label><input id="rPeople">
      <label>議題と要点（「## 議題」の下に「- 要点」）</label><textarea id="rTopics" style="min-height:160px"></textarea>
      <label>決定事項（1行に1つ）</label><textarea id="rDecisions"></textarea>
      <label>ToDo（1行に1つ。「やること / 担当 / 期限」）</label><textarea id="rTodos"></textarea>
      </div>
      <div id="semFields">
      <label>演者（名前・所属）</label><input id="zSpeaker">
      <label>キーワード（読点区切り）</label><input id="zKeywords">
      <label>要約</label><textarea id="zSummary"></textarea>
      <label>要点（「## 見出し」の下に「- 要点」）</label><textarea id="zTopics" style="min-height:160px"></textarea>
      <label>データ・エビデンス（1行に1つ）</label><textarea id="zData"></textarea>
      <label>質疑応答（「Q. 質問」の次の行に「A. 回答」）</label><textarea id="zQa"></textarea>
      <label>面談で使えるポイント（1行に1つ）</label><textarea id="zTips"></textarea>
      </div>
      <div class="row">
        <button id="resumBtn">要約だけ作り直す</button>
        <button class="primary" id="saveBtn">Notionに保存</button>
      </div>
      <div class="hint" id="notionLink" style="text-align:center;margin-top:10px"></div>
    </div>

    <h2>文字起こし</h2>
    <textarea id="dTranscript" style="min-height:200px" placeholder="まだ文字起こししていません"></textarea>

    <h2>音声（この端末に保存）</h2>
    <div id="dAudio"></div>
  </main>
</section>

<!-- 設定 -->
<dialog id="settings"><div class="dlg">
  <h2 style="margin-top:0;outline:none" tabindex="-1" autofocus>設定</h2>
  <label>文字起こしに使うAI</label>
  <select id="sTEngine"><option value="openai">OpenAI</option><option value="gemini">Gemini</option></select>
  <label>議事録づくりに使うAI</label>
  <select id="sSEngine"><option value="claude">Claude</option><option value="gemini">Gemini</option></select>
  <label>使うモデル（全アプリ共通の設定）</label><div class="hint" id="sModelInfo" style="white-space:pre-line">共通設定から読み込み中…</div>
  <label>よく出る言葉・会議（読点区切り。聞き間違いが減ります）</label>
  <textarea id="sHint" placeholder="例：〇〇病院、勉強会、説明会"></textarea>
  <label>よく出る言葉・セミナー（疾患名・製品名・試験名など）</label>
  <textarea id="sHintSem" placeholder="例：抑肝散、補中益気湯、牛車腎気丸、フレイル"></textarea>
  <label>録音の区切り（分）</label><input id="sSeg" type="number" min="1" max="20">
  <label>料金表示の為替レート</label><div class="hint" id="sRateInfo">共通設定から読み込み中…</div>
  <div class="hint" style="margin-top:12px">仕事の会議ではOpenAI＋Claudeがおすすめです。Geminiの無料枠は送った内容がGoogleの改善に使われることがあります。</div>
  <div class="row" style="justify-content:space-between"><button id="sLogout">ログアウト</button><span><button id="sClose">閉じる</button> <button class="primary" id="sSave">保存</button></span></div>
</div></dialog>

<div class="toast" id="toast"></div>
<div id="busyOverlay" class="hidden" style="position:fixed;inset:0;background:rgba(255,255,255,.92);z-index:30;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center">
  <div style="font-weight:600;margin-bottom:10px" id="busyTitle">音声を準備しています</div>
  <div class="progress" style="width:min(80vw,360px)"><div id="busyBar"></div></div>
  <div class="hint" id="busyText" style="margin-top:8px"></div>
  <div class="hint" style="margin-top:14px">終わるまでこの画面のままお待ちください</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js"></script>
<script>
// ===== ログイン（ほかのアプリと同じSupabaseのアカウント） =====
const SB_URL = "https://oqtyorwlrnrcyjxiassg.supabase.co";
const sb = supabase.createClient(SB_URL, "sb_publishable_5KRsDfHG07lsUL7uUr6zpQ_2ehucxbJ");
async function token() { const { data } = await sb.auth.getSession(); return data.session?.access_token; }

// ===== 設定 =====
const DEF = { url:SB_URL+"/functions/v1/minutes", tEngine:"openai", tModelOpenai:"gpt-4o-transcribe", tModelGemini:"gemini-3.5-flash",
  sEngine:"claude", sModelClaude:"claude-sonnet-5-5", sModelGemini:"gemini-3.5-flash", hint:"", hintSem:"", seg:5, rate:155, mode:"meeting" };
let S = { ...DEF, ...JSON.parse(localStorage.getItem("minutes-settings") || "{}") };
S.url = DEF.url;
const $ = id => document.getElementById(id);
const toast = (m, ms=2500) => { const t=$("toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"), ms); };

function openSettings() {
  $("sTEngine").value=S.tEngine; $("sSEngine").value=S.sEngine;
  $("sModelInfo").textContent = modelInfo();
  $("sHint").value=S.hint; $("sHintSem").value=S.hintSem; $("sSeg").value=S.seg; $("sRateInfo").textContent=rateInfo(); $("settings").showModal();
  // 開いた瞬間に入力欄へカーソルが入ってキーボードが出ないようにする
  const ae = document.activeElement; if (ae && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName)) ae.blur();
}
$("openSettings").onclick = openSettings;
$("sClose").onclick = () => $("settings").close();
$("sSave").onclick = () => {
  S.tEngine=$("sTEngine").value; S.sEngine=$("sSEngine").value;
  S.hint=$("sHint").value.trim(); S.hintSem=$("sHintSem").value.trim(); S.seg=Math.min(20,Math.max(1,+$("sSeg").value||5));
  localStorage.setItem("minutes-settings", JSON.stringify(S)); $("settings").close(); toast("保存しました"); renderList();
};

// ===== 料金 =====
// 為替レートは全アプリ共通の設定（Supabase の app_settings / global / usd_jpy、毎日自動更新）から読む
let RATE = { v: 155, at: null };
try { const c = JSON.parse(localStorage.getItem("shared-usd-jpy") || "null"); if (c?.v) RATE = c; } catch {}
const rateInfo = () => `1ドル＝${RATE.v}円` + (RATE.at ? `（${new Date(RATE.at).toLocaleDateString("ja-JP")}更新・全アプリ共通／自動更新）` : "（共通設定をまだ読めていません）");
// AIモデルも全アプリ共通の設定（app_settings / minutes）で決める。ここでは表示用に読むだけ（実際の選択は関数側）
let MODELS = {};
try { MODELS = JSON.parse(localStorage.getItem("shared-minutes-models") || "{}") || {}; } catch {}
const modelInfo = () => {
  const m = MODELS; if (!m.summary_model) return "（共通設定をまだ読めていません）";
  return `文字起こし：${S.tEngine==="gemini" ? m.gemini_model : m.transcribe_model}\nまとめ・標準：${S.sEngine==="gemini" ? m.gemini_model : m.summary_model}\nまとめ・高精度：${S.sEngine==="gemini" ? m.gemini_model : m.summary_model_hq}`;
};
async function loadRate() {
  try {
    const { data, error } = await sb.from("app_settings").select("app, key, value, updated_at").in("app", ["global","minutes"]);
    if (error || !data) return;
    const r = data.find(x => x.app==="global" && x.key==="usd_jpy"), v = Number(r?.value);
    if (v > 0) { RATE = { v, at: r.updated_at }; localStorage.setItem("shared-usd-jpy", JSON.stringify(RATE)); }
    MODELS = Object.fromEntries(data.filter(x => x.app==="minutes").map(x => [x.key, x.value]));
    localStorage.setItem("shared-minutes-models", JSON.stringify(MODELS));
    renderList();
  } catch {}
}
const yen = usd => { const y = usd*RATE.v; return y < 10 ? y.toFixed(1) : Math.round(y).toLocaleString(); };
const totalUsd = m => m.cost ? (m.cost.t||0)+(m.cost.s||0) : null;
function addCost(kind, usd) {
  cur.cost = cur.cost || { t:0, s:0, unknown:false };
  if (usd == null) cur.cost.unknown = true; else cur.cost[kind] += usd;
}
const costLabel = m => { const u = totalUsd(m); if (u == null) return ""; return "約"+yen(u)+"円"+(m.cost.unknown?"＋α":""); };

// ===== IndexedDB =====
let db;
const dbReady = new Promise((res, rej) => {
  const r = indexedDB.open("minutes-db", 1);
  r.onupgradeneeded = () => {
    const d = r.result;
    d.createObjectStore("meetings", { keyPath:"id" });
    d.createObjectStore("segments", { keyPath:"id", autoIncrement:true }).createIndex("meeting","meetingId");
  };
  r.onsuccess = () => { db=r.result; res(); }; r.onerror = () => rej(r.error);
});
const tx = (store, mode="readonly") => db.transaction(store, mode).objectStore(store);
const req = r => new Promise((res, rej) => { r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
const putMeeting = m => req(tx("meetings","readwrite").put(m));
const getMeeting = id => req(tx("meetings").get(id));
const allMeetings = () => req(tx("meetings").getAll());
const addSegment = s => req(tx("segments","readwrite").add(s));
const putSegment = s => req(tx("segments","readwrite").put(s));
const getSegments = async id => (await req(tx("segments").index("meeting").getAll(id))).sort((a,b)=>a.idx-b.idx);
async function deleteMeeting(id) {
  for (const s of await getSegments(id)) await req(tx("segments","readwrite").delete(s.id));
  await req(tx("meetings","readwrite").delete(id));
}

// ===== 会議／セミナー =====
const MODE_NAME = { meeting:"会議", seminar:"セミナー" };
function paintMode() { document.querySelectorAll("#modeSeg button").forEach(b => b.classList.toggle("on", b.dataset.m===S.mode)); }
document.querySelectorAll("#modeSeg button").forEach(b => b.onclick = () => {
  S.mode = b.dataset.m; localStorage.setItem("minutes-settings", JSON.stringify(S)); paintMode();
});
paintMode();
const modeOf = m => m.mode || "meeting";
// まとめの精度：選んでいなければ、セミナーは高精度・会議は標準
const qualityOf = m => m.quality || (modeOf(m)==="seminar" ? "hq" : "standard");

// ===== 録音 =====
let stream, recorder, meeting, segIdx=0, startAt=0, tick, segTimer, wakeLock, chunks=[];
const mime = ["audio/mp4","audio/webm;codecs=opus","audio/webm"].find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
const fmt = sec => { sec=Math.floor(sec); const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  return (h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0"); };

function startSegment() {
  // 区切りごとに独立した入れ物を使う（切り替え時に前の録音と混ざらないように）
  const parts = [];
  const thisIdx = segIdx++;
  const mid = meeting.id;
  const rec = new MediaRecorder(stream, mime ? { mimeType:mime, audioBitsPerSecond:64000 } : {});
  rec.ondataavailable = e => { if (e.data.size) { parts.push(e.data); lastData = Date.now(); } };
  rec.onstop = async () => {
    const blob = new Blob(parts, { type: rec.mimeType || mime || "audio/mp4" });
    if (blob.size) await addSegment({ meetingId:mid, idx:thisIdx, blob, mime:blob.type, text:null });
  };
  rec.start(1000);
  recorder = rec;
}

// ===== 音量メーター =====
// 声の大きさ（dB）を見て、文字起こしに十分な音量かを表示する
let actx = null, meterSrc = null, meterRAF = 0, mStats = { total:0, voice:0 };
function levelState(db) {
  if (db < -50) return { t:"音を拾えていません（マイクが遠いか、周りが静かです）", c:"#e03e3e" };
  if (db < -38) return { t:"小さめです。スマホを話す人に近づけてください", c:"#d9730d" };
  if (db > -6)  return { t:"大きすぎます。少し離してください", c:"#d9730d" };
  return { t:"ちょうどいい音量です", c:"#0f7b6c" };
}
function startMeter(st) {
  try {
    actx.resume?.();
    meterSrc = actx.createMediaStreamSource(st);
    const an = actx.createAnalyser(); an.fftSize = 2048; meterSrc.connect(an);
    const data = new Float32Array(an.fftSize);
    let shown = -90, winMax = -90, winStart = performance.now(); const recent = [];
    mStats = { total:0, voice:0 };
    $("meter").classList.remove("hidden");
    const loop = () => {
      an.getFloatTimeDomainData(data);
      let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i]*data[i];
      const db = 20*Math.log10(Math.sqrt(sum/data.length) + 1e-9);
      shown = Math.max(db, shown - 1.2);           // 針がゆっくり下がるように
      winMax = Math.max(winMax, db);
      $("mfill").style.width = Math.max(0, Math.min(100, (shown+60)/60*100)) + "%";
      const now = performance.now();
      if (now - winStart >= 1000) {                // 1秒ごとに判定を更新
        recent.push(winMax); if (recent.length > 3) recent.shift();
        mStats.total++; if (winMax > -40) mStats.voice++;
        const st2 = levelState(Math.max(...recent));
        $("mtext").textContent = st2.t; $("mtext").style.color = st2.c; $("mfill").style.background = st2.c;
        winMax = -90; winStart = now;
      }
      meterRAF = requestAnimationFrame(loop);
    };
    $("mtext").textContent = "音量を確認しています…"; $("mtext").style.color = "var(--sub)";
    loop();
  } catch (e) { $("meter").classList.add("hidden"); }
}
function stopMeterSilently() {
  cancelAnimationFrame(meterRAF);
  try { meterSrc?.disconnect(); } catch {}
  meterSrc = null;
}
function stopMeter() {
  cancelAnimationFrame(meterRAF);
  try { meterSrc?.disconnect(); } catch {}
  meterSrc = null; $("meter").classList.add("hidden"); $("mfill").style.width = "0";
  // 録音全体で声を拾えていた時間が少なければ知らせる

    setTimeout(() => toast("録音中、音が小さい時間が長めでした。文字起こしの精度が落ちるかもしれません", 5000), 800);
}

async function startRec() {
  // iPhoneはタップした瞬間でないと音の処理を始められないので、最初に用意する
  try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume?.(); } catch {}
  try { stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } }); }
  catch { return toast("マイクを使う許可が必要です"); }
  const now = new Date();
  meeting = { id:"m"+now.getTime(), title:"", createdAt:now.toISOString(), duration:0, status:"録音中", source:"rec", mode:S.mode };
  await putMeeting(meeting);
  recording = true; gaps = []; gapStart = null; lastData = Date.now(); watchTrack();
  segIdx=0; startAt=Date.now(); startSegment();
  if (actx) startMeter(stream);
  segTimer = setInterval(() => { if (recorder?.state !== "recording") return; recorder.stop(); startSegment(); }, S.seg*60*1000);
  tick = setInterval(() => $("timer").textContent = fmt((Date.now()-startAt)/1000), 500);
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  $("recBtn").classList.add("on");
  $("recHint").textContent = "録音中…画面を閉じたり他のアプリに切り替えると止まることがあります";
}

async function stopRec() {
  recording = false; clearInterval(segTimer); clearInterval(tick); stopMeter(); $("recAlert").classList.add("hidden");
  if (recorder?.state === "recording") await new Promise(r => { const prev=recorder.onstop; recorder.onstop=async()=>{ await prev(); r(); }; recorder.stop(); });
  stream?.getTracks().forEach(t=>t.stop());
  try { await wakeLock?.release(); } catch {}
  if (gapStart) { gaps.push({ from:gapStart, to:Date.now() }); gapStart = null; }
  const lost = gaps.reduce((a,g)=>a+(g.to-g.from),0);
  // 実際に録れていた時間（録れていなかった時間を引く）
  meeting.duration = Math.max(0, (Date.now()-startAt-lost)/1000); meeting.gaps = gaps; meeting.status="未処理";
  await putMeeting(meeting);
  $("recBtn").classList.remove("on"); $("timer").textContent="00:00";
  $("recHint").textContent="タップで録音開始。録音中は画面を開いたままにしてください。";
  const id = meeting.id; meeting=null; renderList(); openDetail(id);
  if (lost > 5000) setTimeout(() => toast(`途中で約${Math.round(lost/60000)||1}分、録音できていない時間がありました`, 5000), 600);
}
$("recBtn").onclick = () => recording ? stopRec() : startRec();

// ===== 録音が止まったときの検知と再開 =====
// iPhoneは画面を消したりアプリを切り替えるとマイクを止める。戻ってきたら確かめて、止まっていれば録音し直す
let recording = false, lastData = 0, gaps = [], gapStart = null;
const fmtClock = t => new Date(t).toLocaleTimeString("ja-JP", { hour:"2-digit", minute:"2-digit" });
function watchTrack() {
  const tr = stream?.getAudioTracks()[0]; if (!tr) return;
  tr.onmute = () => { if (recording && !gapStart) gapStart = Date.now(); };
  tr.onended = () => { if (recording && !gapStart) gapStart = Date.now(); };
}
const micDead = () => {
  const tr = stream?.getAudioTracks()[0];
  return !tr || tr.readyState === "ended" || tr.muted || recorder?.state !== "recording" || Date.now() - lastData > 3000;
};
async function resumeRec() {
  try {
    try { if (recorder?.state === "recording") recorder.stop(); } catch {}
    stream?.getTracks().forEach(t => t.stop());
    try { actx?.resume?.(); } catch {}
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
    watchTrack(); lastData = Date.now(); startSegment();
    stopMeterSilently(); if (actx) startMeter(stream);
    if (gapStart) { gaps.push({ from:gapStart, to:Date.now() }); }
    const g = gaps[gaps.length-1];
    gapStart = null; $("recAlert").classList.add("hidden");
    toast(g ? `録音を再開しました（${fmtClock(g.from)}〜${fmtClock(g.to)} は録れていません）` : "録音を再開しました", 4500);
    try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  } catch (e) {
    $("recAlertText").textContent = "マイクが止まっています。下のボタンを押すと録音を再開します。";
    $("recAlert").classList.remove("hidden");
  }
}
$("recResume").onclick = () => resumeRec();
document.addEventListener("visibilitychange", async () => {
  if (!recording) return;
  if (document.visibilityState === "hidden") { if (!gapStart) gapStart = Date.now(); return; }
  try { wakeLock = await navigator.wakeLock?.request("screen"); } catch {}
  await new Promise(r => setTimeout(r, 1500));   // マイクが戻るか少し待つ
  if (!recording) return;

});
// 画面を開いたままでもマイクが止まることがある（電話・Siriなど）ので定期的に確かめる
setInterval(() => {

  if (micDead()) { if (!gapStart) gapStart = Date.now(); resumeRec(); }
}, 5000);

// ===== 音声ファイル読み込み =====
// 長い音声（ボイスメモなど）は端末の中で5分ごとのMP3に分けてから文字起こしする
const SPLIT_SEC = 300, OUT_RATE = 16000;
const busyShow = (title, p, text) => { $("busyOverlay").classList.remove("hidden"); $("busyTitle").textContent = title; $("busyBar").style.width = Math.round(p*100)+"%"; $("busyText").textContent = text||""; };
const busyHide = () => $("busyOverlay").classList.add("hidden");

// 16kHz・モノラルの音を受け取り、5分ごとにMP3ファイルにまとめる
function makeSegmenter() {
  const parts = []; let enc = null, chunks = [], count = 0, buf = new Int16Array(11520), bi = 0;
  const flushBuf = () => { if (!bi) return; const o = enc.encodeBuffer(buf.subarray(0, bi)); if (o.length) chunks.push(new Uint8Array(o)); bi = 0; };
  const close = () => {
    if (!enc) return; flushBuf(); const o = enc.flush(); if (o.length) chunks.push(new Uint8Array(o));
    parts.push({ blob: new Blob(chunks, { type:"audio/mp3" }), seconds: count/OUT_RATE }); enc = null; chunks = []; count = 0;
  };
  return {
    push(x) {
      if (!enc) enc = new lamejs.Mp3Encoder(1, OUT_RATE, 32);
      buf[bi++] = Math.max(-32768, Math.min(32767, Math.round(x*32767))); count++;
      if (bi === buf.length) flushBuf();
      if (count >= SPLIT_SEC*OUT_RATE) close();
    },
    finish() { close(); return parts; },
  };
}
// 元のサンプリング周波数から16kHzへ（区間の平均で間引く）
function makeResampler(srcRate, out) {
  const r = srcRate / OUT_RATE; let acc = 0, cnt = 0, idx = 0, next = r;
  return x => { acc += x; cnt++; idx++; if (idx >= next) { out(acc/cnt); acc = 0; cnt = 0; next += r; } };
}
const yieldUI = () => new Promise(r => setTimeout(r, 0));

// m4a（ボイスメモ）などのMP4形式：少しずつ復号するので長い音声でも端末のメモリに収まる
async function splitMp4(file, onP) {
  if (!window.AudioDecoder || !window.MP4Box) throw new Error("unsupported");
  const ab = await file.arrayBuffer(); ab.fileStart = 0;
  const mp4 = MP4Box.createFile(); let info = null;
  mp4.onReady = i => info = i; mp4.onError = () => {};
  mp4.appendBuffer(ab); mp4.flush();
  const tr = info?.audioTracks?.[0]; if (!tr) throw new Error("unsupported");
  const entry = mp4.getTrackById(tr.id).mdia.minf.stbl.stsd.entries[0];
  const description = entry.esds?.esd?.descs?.[0]?.descs?.[0]?.data;
  const config = { codec: tr.codec, sampleRate: tr.audio.sample_rate, numberOfChannels: tr.audio.channel_count, ...(description ? { description } : {}) };
  if (!(await AudioDecoder.isConfigSupported(config)).supported) throw new Error("unsupported");
  const samples = []; mp4.onSamples = (id, u, list) => samples.push(...list);
  mp4.setExtractionOptions(tr.id, null, { nbSamples: 1e7 }); mp4.start(); mp4.flush();
  if (!samples.length) throw new Error("unsupported");

  const seg = makeSegmenter(); let resample = null, rate = 0, decErr = null; const mono = [];
  const dec = new AudioDecoder({
    output: d => {
      try {
        if (d.sampleRate !== rate) { rate = d.sampleRate; resample = makeResampler(rate, x => seg.push(x)); }
        const n = d.numberOfFrames, ch = d.numberOfChannels;
        if (mono.length < 1 || mono[0].length < n) { mono[0] = new Float32Array(n); mono[1] = new Float32Array(n); }
        const sum = mono[0], tmp = mono[1]; sum.fill(0, 0, n);
        for (let c = 0; c < ch; c++) { d.copyTo(tmp, { planeIndex:c, format:"f32-planar" }); for (let i = 0; i < n; i++) sum[i] += tmp[i]; }
        for (let i = 0; i < n; i++) resample(sum[i]/ch);
      } catch (e) { decErr = e; } finally { d.close(); }
    },
    error: e => decErr = e,
  });
  dec.configure(config);
  for (let i = 0; i < samples.length; i++) {
    const sm = samples[i];
    dec.decode(new EncodedAudioChunk({ type:"key", timestamp: Math.round(sm.cts*1e6/sm.timescale), duration: Math.round(sm.duration*1e6/sm.timescale), data: sm.data }));
    if (dec.decodeQueueSize > 64) await new Promise(r => dec.addEventListener("dequeue", r, { once:true }));
    if (decErr) throw decErr;
    if (i % 2000 === 0) { onP(i/samples.length); await yieldUI(); }
  }
  await dec.flush(); dec.close();
  if (decErr) throw decErr;
  return seg.finish();
}

// それ以外の形式（mp3・wavなど）：まとめて復号する。長すぎる音声は端末によっては失敗する
async function splitDecodeAll(file, onP) {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  const ctx = new Ctx({ sampleRate: OUT_RATE });
  const ab = await ctx.decodeAudioData(await file.arrayBuffer()); ctx.close?.();
  const seg = makeSegmenter(); const resample = makeResampler(ab.sampleRate, x => seg.push(x));
  const chs = Array.from({ length: ab.numberOfChannels }, (_, c) => ab.getChannelData(c));
  const step = OUT_RATE*30;
  for (let i = 0; i < ab.length; i++) {
    let v = 0; for (const c of chs) v += c[i]; resample(v/chs.length);
    if (i % step === 0) { onP(i/ab.length); await yieldUI(); }
  }
  return seg.finish();
}

// 1つのファイルを読み込んで記録を作る（長い音声は5分ごとに分ける）
async function importOne(f, k, n) {
  const head = n > 1 ? `（${k}／${n}）` : "";
  const onP = p => busyShow("音声を準備しています"+head, p, `${f.name}　${Math.round(p*100)}%`);
  busyShow("音声を準備しています"+head, 0, `${f.name}　読み込み中…`);
  let parts = null;
  try { parts = await splitMp4(f, onP); }
  catch (e1) {
    try { parts = await splitDecodeAll(f, onP); }
    catch (e2) { parts = null; }
  }
  if (!parts && f.size > 24*1024*1024) return null;
  const now = new Date();
  // 録音した日（ファイルの日時）を議事録の日付にする
  const rec = f.lastModified ? new Date(f.lastModified) : now;
  const recDate = `${rec.getFullYear()}-${String(rec.getMonth()+1).padStart(2,"0")}-${String(rec.getDate()).padStart(2,"0")}`;
  const m = { id:"m"+now.getTime()+"-"+k, title:f.name.replace(/\.[^.]+$/,""), createdAt:now.toISOString(), date:recDate, status:"未処理", mode:S.mode,
    source: parts ? "import-split" : "import", duration: parts ? parts.reduce((a,p)=>a+p.seconds,0) : 0 };
  await putMeeting(m);
  if (parts) { for (let i=0;i<parts.length;i++) await addSegment({ meetingId:m.id, idx:i, blob:parts[i].blob, mime:"audio/mp3", text:null, name:`part${i+1}.mp3` }); }
  else await addSegment({ meetingId:m.id, idx:0, blob:f, mime:f.type, text:null, name:f.name });
  return m.id;
}

    if (l.startsWith("#")) { t={heading:l.replace(/^#+\s*/,""),points:[]}; topics.push(t); }
    else { if(!t){t={heading:"要点",points:[]};topics.push(t);} t.points.push(l.replace(/^[-・*]\s*/,"")); }
  }
  return { title:$("rTitle").value.trim(), genre:$("rGenre").value.trim(), summary:$("rSummary").value.trim(),
    participants:$("rPeople").value.split(/[、,]/).map(s=>s.trim()).filter(Boolean), topics,
    decisions:lines("rDecisions"),
    todos:lines("rTodos").map(l=>{ const [task,owner="",due=""]=l.split("/").map(s=>s.trim()); return {task,owner,due}; }) };
}

async function api(body, isForm=false) {
  const t = await token();
  if (!t) { show("login"); throw new Error("ログインしてください"); }
  const auth = { Authorization:"Bearer "+t };
  const r = await fetch(S.url, { method:"POST", headers: isForm ? auth : {...auth,"Content-Type":"application/json"},
    body: isForm ? body : JSON.stringify(body) });
  const d = await r.json().catch(()=>({error:"応答を読めませんでした（"+r.status+"）"}));
  if (!r.ok || d.error) throw new Error(d.error || r.status);
  return d;
}

const setProg = (p, text) => { $("prog").classList.remove("hidden"); $("prog").firstElementChild.style.width=(p*100)+"%"; $("progText").textContent=text; };
const busy = b => ["runBtn","resumBtn","saveBtn","back"].forEach(id=>$(id).disabled=b);

const audioSeconds = blob => new Promise(res => {
  const a = new Audio(); a.preload="metadata"; a.src = URL.createObjectURL(blob);
  a.onloadedmetadata = () => res(isFinite(a.duration) ? Math.ceil(a.duration) : 0); a.onerror = () => res(0);
  setTimeout(()=>res(0), 5000);
});

async function transcribeAll(force) {
  const segs = await getSegments(cur.id);
  if (force) for (const s of segs) { s.text=null; await putSegment(s); }
  let done = segs.filter(s=>s.text!==null).length;
  for (const s of segs) {
    if (s.text !== null) continue;
    setProg(done/(segs.length+1), `文字起こし中… ${done+1}／${segs.length}`);
    const fd = new FormData();
    const ext = (s.mime||"").includes("webm")?"webm":(s.name?.split(".").pop()||"m4a");
    fd.append("action","transcribe"); fd.append("engine",S.tEngine); fd.append("hint", modeOf(cur)==="seminar" ? S.hintSem : S.hint);
    // 読み込んだファイルは長さが分からないので、OpenAIでは長い音声も扱えるwhisper-1を使う
    // ふだんはモデル名を送らず、関数が共通設定のモデルを使う
    if (cur.source==="import" && S.tEngine==="openai") fd.append("model", "whisper-1");
    if (S.tEngine==="openai") fd.append("seconds", String(await audioSeconds(s.blob))); // 分単位の料金計算用
    fd.append("file", new File([s.blob], `seg${s.idx}.${ext}`, { type:s.mime || "audio/mp4" }));
    let d, tries=0;
    while (true) {
      try { d = await api(fd, true); break; }
      catch (e) { if (++tries>=2) throw e; await new Promise(r=>setTimeout(r,2000)); }
    }
    s.text = (d.text||"").trim(); await putSegment(s); done++;
    addCost("t", d.usd); await putMeeting(cur);
  }
  cur.transcript = segs.map(s=>s.text).filter(Boolean).join("\n");
  $("dTranscript").value = cur.transcript;
  await putMeeting(cur);
}

async function summarizeNow() {
  setProg(.92, "議事録を作成中…");
  cur.transcript = $("dTranscript").value.trim(); cur.memo = $("dMemo").value.trim();
  const d = await api({ action:"summarize", mode:modeOf(cur), transcript:cur.transcript, memo:cur.memo, engine:S.sEngine,
    quality: qualityOf(cur) });
  cur.result = d.result; cur.status="作成済み"; addCost("s", d.usd); await putMeeting(cur);
  showMeta((await getSegments(cur.id)).length);
  setProg(1, "できました。内容を確認してNotionに保存してください");
  $("dTitle").textContent = cur.result.title || "議事録"; fillResult(cur.result);
}

$("runBtn").onclick = async () => {
  if (cur.result && !confirm("文字起こしからやり直しますか？")) return;
  busy(true);
  try { await transcribeAll(!!cur.result); await summarizeNow(); }
  catch (e) { cur.status="エラー"; await putMeeting(cur); $("progText").textContent="エラー："+e.message+"（もう一度押すと続きから再開します）"; }
  busy(false);
};
$("resumBtn").onclick = async () => { busy(true); try { await summarizeNow(); } catch(e){ $("progText").textContent="エラー："+e.message; } busy(false); };

$("saveBtn").onclick = async () => {
  busy(true); $("saveBtn").textContent="保存中…";
  try {
    cur.result = readResult(); cur.date = $("rDate").value; cur.transcript = $("dTranscript").value.trim();
    const d = await api({ action:"save", mode:modeOf(cur), result:cur.result, transcript:cur.transcript, date:cur.date, duration:cur.duration?fmt(cur.duration):"" });
    cur.notionUrl = d.url; cur.status="保存済み"; await putMeeting(cur);
    $("notionLink").innerHTML = `<a href="${d.url}" target="_blank">Notionで開く</a>`; toast("Notionに保存しました");
  } catch (e) { toast("保存できませんでした："+e.message, 4000); }
  paintDetailMode(); busy(false);
};

$("delBtn").onclick = async () => {
  if (!confirm("この記録と音声を端末から削除しますか？（Notionのページは残ります）")) return;
  await deleteMeeting(cur.id); show("home"); renderList();
};
$("dTranscript").onchange = async () => { cur.transcript=$("dTranscript").value; await putMeeting(cur); };
$("dMemo").onchange = async () => { cur.memo=$("dMemo").value; await putMeeting(cur); };

// ログイン・ログアウト
$("loginForm").onsubmit = async e => {
  e.preventDefault(); $("lBtn").disabled = true; $("lMsg").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email:$("lEmail").value.trim(), password:$("lPass").value });
  $("lBtn").disabled = false;
  if (error) { $("lMsg").textContent = "ログインできませんでした：" + error.message; return; }
  $("lPass").value = ""; show("home"); renderList(); loadRate();
};
$("sLogout").onclick = async () => { await sb.auth.signOut(); $("settings").close(); show("login"); };

// 起動
dbReady.then(async () => {
  // 録音中に閉じてしまった記録は「未処理」に戻す
  for (const m of await allMeetings()) if (m.status==="録音中") { m.status="未処理"; await putMeeting(m); }
  renderList();
  if (navigator.storage?.persist) navigator.storage.persist();
  const t = await token(); show(t ? "home" : "login"); if (t) loadRate();
});
</script>
